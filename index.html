<!doctype html>
<html lang="de">
  <head>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101312" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)" />
    <!-- Gespeichertes Design sofort setzen, damit der dunkle Start nicht hell aufblitzt -->
    <script>
      try {
        var t = localStorage.getItem('eduplanner.theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <title>Education Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
